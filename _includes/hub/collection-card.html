{% assign topic = include.topic %}
{% assign collection = site.collections | where: 'label', topic.collection | first %}
<a class="topic-card" href="{{ topic.url | relative_url }}">
  <span class="topic-icon" aria-hidden="true">{{ include.icon | default: topic.icon }}</span>
  <span class="topic-copy">
    <strong>{{ topic.title }}</strong>
    <span>{{ topic.description }}</span>
    <small>{% if collection %}{{ collection.docs.size }} 篇内容 {% endif %}<span aria-hidden="true">↗</span></small>
  </span>
</a>
